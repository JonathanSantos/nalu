[package]
name = "nalu"
version = "1.1.0"
edition = "2021"
description = "Nalu: one wave, every shell. A typed script language that compiles to Bash (Linux, macOS) and PowerShell (Windows)."
license = "MIT"

# Zero dependências externas: só a biblioteca padrão do Rust.
[dependencies]

[[bin]]
name = "nalu"
path = "src/main.rs"

[lib]
name = "nalu"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
